<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beast of Bermuda Interactive Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
    html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #111;
    }

    /* Base styles and 70% opacity */
    .shrine-marker, .water-marker {
        transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out, opacity 0.2s ease-in-out;
        opacity: 0.7;
    }

    .shrine-marker:hover, .water-marker:hover {
        opacity: 1.0;
        transform: scale(1.35);
    }

    .shrine-survival:hover {
        filter: drop-shadow(0 0 12px #00ccff);
    }
    .shrine-mobility:hover {
        filter: drop-shadow(0 0 12px #00ff00);
    }
    .shrine-power:hover {
        filter: drop-shadow(0 0 12px #ff0000);
    }
    .water-hover:hover {
        filter: drop-shadow(0 0 12px #00aaff);
    }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        var mapWidth = 2750; 
        var mapHeight = 2580;

        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 3
        });

        var bounds = [[0, 0], [mapHeight, mapWidth]];
        var image = L.imageOverlay('map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        function createIcon(url, cssClass, size) {
            return L.divIcon({
                className: cssClass,
                html: '<img src="' + url + '" style="width: ' + size + 'px; height: ' + size + 'px; display: block;">',
                iconSize: [size, size],
                iconAnchor: [size/2, size/2],
                popupAnchor: [0, -size/2]
            });
        }

        // Major Shrines (Bigger size: 42px, using Major SVGs)
        var majorSurvivalIcon = createIcon('MajorSurvival.svg', 'shrine-marker shrine-survival', 42);
        var majorMobilityIcon = createIcon('MajorMobility.svg', 'shrine-marker shrine-mobility', 42);
        var majorPowerIcon    = createIcon('MajorPower.svg',    'shrine-marker shrine-power',    42);

        // Minor Shrines (Standard size: 36px, using normal SVGs)
        var minorSurvivalIcon = createIcon('SurvivalShrine.svg', 'shrine-marker shrine-survival', 36);
        var minorMobilityIcon = createIcon('MobilityShrine.svg', 'shrine-marker shrine-mobility', 36);
        var minorPowerIcon    = createIcon('PowerShrine.svg',    'shrine-marker shrine-power',    36);

        // Water Icons (Active & Visited)
        var waterIcon     = createIcon('Waterdrop.svg', 'water-marker water-hover', 30);
        var waterDoneIcon = createIcon('waterdone.svg', 'water-marker water-hover', 30);

        var shrines = [
            // Major Shrines
            { name: "Major Water Survival Shrine", coords: [780, 2145], icon: majorSurvivalIcon },
            { name: "Major Water Mobility Shrine", coords: [961, 1481], icon: majorMobilityIcon },
            { name: "Major Water Power Shrine",    coords: [605, 1216], icon: majorPowerIcon },
            { name: "Major Land Survival Shrine", coords: [1612, 1087], icon: majorSurvivalIcon },
            { name: "Major Land Mobility Shrine", coords: [743, 1321],  icon: majorMobilityIcon },
            { name: "Major Land Power Shrine",    coords: [1047, 2344], icon: majorPowerIcon },

            // Minor Mobility Shrines
            { name: "Minor Mobility Shrine", coords: [888, 2460], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [715, 2462], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [409, 2543], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [584, 1672], icon: minorMobilityIcon, note: "Under the pond" },
            { name: "Minor Mobility Shrine", coords: [670, 1892], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1039, 967], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [995, 1054], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1989, 1770], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [2450, 2136], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [2254, 1639], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1448, 1888], icon: minorMobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1411, 259], icon: minorMobilityIcon },

            // Minor Survival Shrines
            { name: "Minor Survival Shrine", coords: [424, 2208], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [425, 1794], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [429, 1640], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [701, 1757], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [1280, 1888], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [2013, 1583], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [1303, 2299], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [2440, 1992], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [2080, 2178], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [889, 1542], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [1408, 1178], icon: minorSurvivalIcon },
            { name: "Minor Survival Shrine", coords: [1559, 661], icon: minorSurvivalIcon },

            // Minor Power Shrines
            { name: "Minor Power Shrine", coords: [428, 2368], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [711, 2361], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [871, 1252], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1076, 1450], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1602, 1366], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1710, 2033], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [2481, 2231], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1491, 1630], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [916, 1987], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1667, 351], icon: minorPowerIcon },
            { name: "Minor Power Shrine", coords: [1776, 367], icon: minorPowerIcon }
        ];

        var waterSpots = [
            { name: "Trinity Islands Puddle", coords: [213, 2313] },
            { name: "Tower Pond", coords: [435, 2377], note: "Bugged, undrinkable but counts for Water source trial" },
            { name: "Recluse Puddle", coords: [399, 2306] },
            { name: "Cliff Lake", coords: [600, 2486] },
            { name: "Spiral Pond", coords: [516, 2177] },
            { name: "Scavenger Pond", coords: [552, 2363] },
            { name: "Lurde Puddle", coords: [753, 2352] },
            { name: "Dark Puddle", coords: [593, 1924], note: "Inside cave, entrance on side of mountain" },
            { name: "Pot Holes", coords: [677, 1887], note: "Always dirty" },
            { name: "Palm Path's Pond", coords: [431, 1842] },
            { name: "Beach Falls", coords: [601, 1815] },
            { name: "Palmforest Lake", coords: [560, 1729] },
            { name: "The Sludge Pit", coords: [550, 1627], note: "Always dirty" },
            { name: "Raised Passage", coords: [805, 1426] },
            { name: "Black Lake", coords: [787, 1387], note: "Always dirty" },
            { name: "Cove Outlook", coords: [816, 1267] },
            { name: "Dribble Puddle", coords: [925, 1215], note: "Inside the cave" },
            { name: "Tranquil Falls", coords: [914, 996] },
            { name: "Ponderer's Pond", coords: [1079, 984] },
            { name: "Lagoon", coords: [1062, 1628] },
            { name: "Scryer's Pond", coords: [1023, 1585] },
            { name: "No Name", coords: [1311, 1624], note: "Bugged, undrinkable" },
            { name: "Traveller's Lake", coords: [1351, 1969] },
            { name: "Sanctuary Pond", coords: [1176, 2091] },
            { name: "Forgotten Pond", coords: [1581, 1811] },
            { name: "Pit Lake", coords: [1603, 1522], note: "Inside the cave" },
            { name: "Feuders Pond", coords: [1871, 1500] },
            { name: "Breath of the Rain", coords: [1325, 890] },
            { name: "Impact Lake", coords: [1979, 1256] },
            { name: "Muddy Oasis", coords: [2190, 1575] },
            { name: "Skull Lake", coords: [2022, 1882] },
            { name: "Dry Puddle", coords: [1864, 2083] },
            { name: "Drymouth Puddle", coords: [1800, 2355] },
            { name: "The Stale Runoff", coords: [1426, 2355], note: "Always dirty" },
            { name: "Sandstorm Oasis", coords: [1357, 2336] },
            { name: "Lightkeeper Lake", coords: [901, 2455] },
            { name: "Canyon Oasis", coords: [1114, 2363] },
            { name: "Crystal Pond", coords: [1224, 2235] },
            { name: "Ashen Pond", coords: [2480, 2054] },
            { name: "The Inbetween", coords: [1723, 1753] },
            { name: "Meadow Pond", coords: [1032, 1854] },
            { name: "Piddle Puddle", coords: [1076, 1807] },
            { name: "Jungle Marsh", coords: [944, 1618], note: "Always dirty" },
            { name: "Pilot's Retreat", coords: [958, 1341] },
            { name: "Flood Puddle", coords: [1475, 1283] },
            { name: "Survival's Bounty", coords: [1598, 1071] },
            { name: "Arrowhead Islands", coords: [1374, 613] },
            { name: "Opal Islands", coords: [1404, 413] },
            { name: "Waterfall Pool", coords: [1521, 207] },
            { name: "Rushing Pool", coords: [1682, 260] },
            { name: "Whistling Islands", coords: [1677, 380] },
            { name: "Rusty Pond", coords: [1694, 526], note: "Inside Cave" }
        ];

        var shrineLayerGroup = L.layerGroup().addTo(map);
        var waterLayerGroup = L.layerGroup().addTo(map);

        shrines.forEach(function(shrine) {
            var content = "<b>" + shrine.name + "</b>";
            if (shrine.note) {
                content += "<br><i>" + shrine.note + "</i>";
            }
            var marker = L.marker(shrine.coords, { icon: shrine.icon }).bindPopup(content);

            // Log shrine coordinates to console on click
            marker.on('click', function() {
                console.log("Clicked Shrine (" + shrine.name + "): [Y: " + shrine.coords[0] + ", X: " + shrine.coords[1] + "]");
            });

            shrineLayerGroup.addLayer(marker);
        });

        waterSpots.forEach(function(spot) {
            var content = "<b>" + spot.name + "</b>";
            if (spot.note) {
                content += "<br><i>" + spot.note + "</i>";
            }
            var marker = L.marker(spot.coords, { icon: waterIcon }).bindPopup(content);

            // Custom state tracking for visited water spots
            marker.isVisited = false;

            // Log water spot coordinates & toggle icon on click
            marker.on('click', function() {
                console.log("Clicked Water Spot: [Y: " + spot.coords[0] + ", X: " + spot.coords[1] + "]");

                // Toggle state
                marker.isVisited = !marker.isVisited;

                // Update marker icon dynamically
                marker.setIcon(marker.isVisited ? waterDoneIcon : waterIcon);
            });

            waterLayerGroup.addLayer(marker);
        });

        map.on('click', function(e) {
            var y = Math.round(e.latlng.lat);
            var x = Math.round(e.latlng.lng);
            console.log("Clicked coordinates: [Y: " + y + ", X: " + x + "]");
        });
    </script>
</body>
</html>
