<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beast of Bermuda Interactive Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
    html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #111;
    }

    .leaflet-marker-icon {
        transition: filter 0.2s ease-in-out, transform 0.2s ease-in-out;
    }

    .shrine-marker:hover {
        transform: scale(1.35);
    }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var mapWidth = 2750; 
        var mapHeight = 2580;

        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 3
        });

        var bounds = [[0, 0], [mapHeight, mapWidth]];
        var image = L.imageOverlay('map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        var survivalIcon = L.icon({
            iconUrl: 'MajorSurvival.svg',
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18],
            className: 'shrine-marker',
            // Adds a drop-shadow glow matching the survival color on hover/default
            html: '' 
        });

        function createShrineIcon(url, glowColor) {
            return L.divIcon({
                className: 'shrine-marker',
                html: '<img src="' + url + '" style="width: 36px; height: 36px; display: block; transition: filter 0.2s, transform 0.2s;" onmouseover="this.style.filter=\'drop-shadow(0 0 10px ' + glowColor + ')\'; this.style.transform=\'scale(1.15)\';" onmouseout="this.style.filter=\'none\'; this.style.transform=\'scale(1)\';">',
                iconSize: [36, 36],
                iconAnchor: [18, 18],
                popupAnchor: [0, -18]
            });
        }

        var survivalIcon = createShrineIcon('MajorSurvival.svg', '#00ff00');
        var powerIcon    = createShrineIcon('MajorPower.svg', '#ff0000');
        var mobilityIcon = createShrineIcon('MajorMobility.svg', '#00ccff');
        
        var shrines = [
            // Major Water Shrines
            { name: "Major Water Survival Shrine", coords: [780, 2145], type: "Water", icon: survivalIcon },
            { name: "Major Water Mobility Shrine", coords: [961, 1481], type: "Water", icon: mobilityIcon },
            { name: "Major Water Power Shrine",    coords: [605, 1216], type: "Water", icon: powerIcon },
            
            // Major Land Shrines
            { name: "Major Land Survival Shrine", coords: [1612, 1087], type: "Land", icon: survivalIcon },
            { name: "Major Land Mobility Shrine", coords: [743, 1321],  type: "Land", icon: mobilityIcon },
            { name: "Major Land Power Shrine",    coords: [1047, 2344], type: "Land", icon: powerIcon }
        ];

        var shrineLayerGroup = L.layerGroup().addTo(map);

        shrines.forEach(function(shrine) {
            var marker = L.marker(shrine.coords, { icon: shrine.icon })
                .bindPopup("<b>" + shrine.name + "</b>");

            shrineLayerGroup.addLayer(marker);
        });

        map.on('click', function(e) {
            var y = Math.round(e.latlng.lat);
            var x = Math.round(e.latlng.lng);
            console.log("Clicked coordinates: [Y: " + y + ", X: " + x + "]");
        });
    </script>
</body>
</html>
