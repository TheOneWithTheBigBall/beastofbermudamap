<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beast of Bermuda Interactive Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
    html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #111;
    }

    .shrine-marker, .water-marker {
        transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
    }

    /* Glow colors on hover */
    .shrine-survival:hover {
        transform: scale(1.35);
        filter: drop-shadow(0 0 12px #00ccff);
    }
    .shrine-mobility:hover {
        transform: scale(1.35);
        filter: drop-shadow(0 0 12px #00ff00);
    }
    .shrine-power:hover {
        transform: scale(1.35);
        filter: drop-shadow(0 0 12px #ff0000);
    }
    .water-hover:hover {
        transform: scale(1.35);
        filter: drop-shadow(0 0 12px #00aaff);
    }

    .shrine-marker, .water-marker {
        transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out, opacity 0.2s ease-in-out;
        opacity: 0.7;
    }
    .shrine-marker:hover, .water-marker:hover {
        opacity: 1.0;
    }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var mapWidth = 2750; 
        var mapHeight = 2580;

        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 3
        });

        var bounds = [[0, 0], [mapHeight, mapWidth]];
        var image = L.imageOverlay('map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        function createIcon(url, cssClass, size) {
            return L.divIcon({
                className: cssClass,
                html: '<img src="' + url + '" style="width: ' + size + 'px; height: ' + size + 'px; display: block;">',
                iconSize: [size, size],
                iconAnchor: [size/2, size/2],
                popupAnchor: [0, -size/2]
            });
        }

        var majorSurvivalIcon = createIcon('MajorSurvival.svg', 'shrine-marker shrine-survival', 42);
        var majorMobilityIcon = createIcon('MajorMobility.svg', 'shrine-marker shrine-mobility', 42);
        var majorPowerIcon    = createIcon('MajorPower.svg',    'shrine-marker shrine-power',    42);

        var minorSurvivalicon = createIcon('SurvivalShrine.svg', 'shrine-marker shrine-survival', 36);
        var minorMobilityicon = createIcon('MobilityShrine.svg', 'shrine-marker shrine-mobility', 36);
        var minorPowerIcon    = createIcon('PowerShrine.svg',    'shrine-marker shrine-power',    36);
        
        var waterIcon = createIcon('Waterdrop.svg', 'water-marker water-hover', 30);

        var shrines = [
            { name: "Major Water Survival Shrine", coords: [780, 2145], icon: survivalIcon },
            { name: "Major Water Mobility Shrine", coords: [961, 1481], icon: mobilityIcon },
            { name: "Major Water Power Shrine",    coords: [605, 1216], icon: powerIcon },
            { name: "Major Land Survival Shrine", coords: [1612, 1087], icon: survivalIcon },
            { name: "Major Land Mobility Shrine", coords: [743, 1321],  icon: mobilityIcon },
            { name: "Major Land Power Shrine",    coords: [1047, 2344], icon: powerIcon },

            { name: "Minor Mobility Shrine", coords: [888, 2460], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [715, 2462], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [409, 2543], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [584, 1672], icon: mobilityIcon, note: "Under the pond" },
            { name: "Minor Mobility Shrine", coords: [670, 1892], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1039, 967], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [995, 1054], icon: mobilityIcon },
            { name: "Minor Mobility Shrine", coords: [1989, 1770], icon: mobilityIcon },

            { name: "Minor Survival Shrine", coords: [424, 2208], icon: survivalIcon },
            { name: "Minor Survival Shrine", coords: [425, 1794], icon: survivalIcon },
            { name: "Minor Survival Shrine", coords: [429, 1640], icon: survivalIcon },
            { name: "Minor Survival Shrine", coords: [701, 1757], icon: survivalIcon },
            { name: "Minor Survival Shrine", coords: [1280, 1888], icon: survivalIcon },
            { name: "Minor Survival Shrine", coords: [2013, 1583], icon: survivalIcon },

            { name: "Minor Power Shrine", coords: [428, 2368], icon: powerIcon },
            { name: "Minor Power Shrine", coords: [711, 2361], icon: powerIcon },
            { name: "Minor Power Shrine", coords: [871, 1252], icon: powerIcon },
            { name: "Minor Power Shrine", coords: [1076, 1450], icon: powerIcon },
            { name: "Minor Power Shrine", coords: [1602, 1366], icon: powerIcon },
            { name: "Minor Power Shrine", coords: [1710, 2033], icon: powerIcon }
        ];

        var waterSpots = [
            { name: "Water Spot", coords: [213, 2313] },
            { name: "Water Spot", coords: [435, 2377], note: "Bugged, undrinkable but counts for Water source trial" },
            { name: "Water Spot", coords: [399, 2306] },
            { name: "Water Spot", coords: [600, 2486] },
            { name: "Water Spot", coords: [516, 2177] },
            { name: "Water Spot", coords: [552, 2363] },
            { name: "Water Spot", coords: [753, 2352] },
            { name: "Water Spot", coords: [593, 1924], note: "Inside cave, entrance on side of mountain" },
            { name: "Water Spot", coords: [677, 1887], note: "Always dirty" },
            { name: "Water Spot", coords: [431, 1842] },
            { name: "Water Spot", coords: [601, 1815] },
            { name: "Water Spot", coords: [560, 1729] },
            { name: "Water Spot", coords: [550, 1627], note: "Always dirty" },
            { name: "Water Spot", coords: [805, 1426] },
            { name: "Water Spot", coords: [787, 1387] },
            { name: "Water Spot", coords: [816, 1267] },
            { name: "Water Spot", coords: [925, 1215], note: "Inside the cave" },
            { name: "Water Spot", coords: [914, 996] },
            { name: "Water Spot", coords: [1079, 984] },
            { name: "Water Spot", coords: [1062, 1628] },
            { name: "Water Spot", coords: [1119, 1596] },
            { name: "Water Spot", coords: [1311, 1624], note: "Bugged, undrinkable but counts for Water source trial" },
            { name: "Water Spot", coords: [1351, 1969] },
            { name: "Water Spot", coords: [1176, 2091] },
            { name: "Water Spot", coords: [1581, 1811] },
            { name: "Water Spot", coords: [1603, 1522], note: "Inside the cave" },
            { name: "Water Spot", coords: [1642, 1536] },
            { name: "Water Spot", coords: [1871, 1500] },
            { name: "Water Spot", coords: [1325, 890] },
            { name: "Water Spot", coords: [1979, 1256] },
            { name: "Water Spot", coords: [2190, 1575] },
            { name: "Water Spot", coords: [2022, 1882] },
            { name: "Water Spot", coords: [1864, 2083] },
            { name: "Water Spot", coords: [1800, 2355] },
            { name: "Water Spot", coords: [1426, 2355] },
            { name: "Water Spot", coords: [1357, 2336] }
        ];

        var shrineLayerGroup = L.layerGroup().addTo(map);
        var waterLayerGroup = L.layerGroup().addTo(map);

        shrines.forEach(function(shrine) {
            var content = "<b>" + shrine.name + "</b>";
            if (shrine.note) {
                content += "<br><i>" + shrine.note + "</i>";
            }
            var marker = L.marker(shrine.coords, { icon: shrine.icon }).bindPopup(content);
            shrineLayerGroup.addLayer(marker);
        });
        
        waterSpots.forEach(function(spot) {
            var content = "<b>" + spot.name + "</b>";
            if (spot.note) {
                content += "<br><i>" + spot.note + "</i>";
            }
            var marker = L.marker(spot.coords, { icon: waterIcon }).bindPopup(content);
            waterLayerGroup.addLayer(marker);
        });

        map.on('click', function(e) {
            var y = Math.round(e.latlng.lat);
            var x = Math.round(e.latlng.lng);
            console.log("Clicked coordinates: [Y: " + y + ", X: " + x + "]");
        });
    </script>
</body>
</html>
